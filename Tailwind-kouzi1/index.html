<style>
  :root{
    --c-primary:#22C55E;
    --c-primary-d:#16A34A;

  html{scroll-behavior:smooth;}
  body{
    font-family:"Noto Sans SC","PingFang SC",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--c-ink);
    background:
      radial-gradient(1200px 600px at 90% -10%, rgba(34,197,94,.08), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(16,185,129,.06), transparent 60%),
      var(--c-bg);
    min-height:100vh;
  }
  .font-display{font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;letter-spacing:.03em;}
  .font-num{font-family:"DM Sans",sans-serif;font-feature-settings:"tnum";}

  /* 顶部主导航渐变 */
  .nav-gradient{
    background:
      linear-gradient(90deg,#15803D 0%,#16A34A 35%,#22C55E 65%,#10B981 100%);
    box-shadow:0 4px 20px -8px rgba(16,163,74,.55);
  }
  .nav-link{position:relative;transition:all .2s ease;}
  .nav-link::after{
    content:'';position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
    width:0;height:2px;background:#fff;border-radius:2px;
    transition:width .25s ease;
  }
  .nav-link:hover::after,.nav-link.active::after{width:75%;}
  .nav-link.active{background:rgba(255,255,255,.18);box-shadow:inset 0 -2px 0 #fff;}

  /* 卡片 */
  .poster-card{transition:transform .35s cubic-bezier(.16,1,.3,1);}
  .poster-card:hover{transform:translateY(-6px);}
  .poster-card:hover .poster-img{transform:scale(1.06);}
  .poster-card:hover .poster-mask{opacity:1;}
  .poster-card:hover .poster-play{transform:scale(1) translateY(0);opacity:1;}
  .poster-img{transition:transform .7s cubic-bezier(.16,1,.3,1);}
  .poster-mask{
    opacity:0;transition:opacity .3s;
    background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.78) 100%);
  }
  .poster-play{
    opacity:0;transform:scale(.85) translateY(8px);
    transition:all .35s cubic-bezier(.16,1,.3,1);
  }
  /* 分类徽章（毛玻璃绿） */
  .badge-tag{
    background:rgba(34,197,94,.95);
    color:#fff;backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(22,163,74,.35);
  }

  /* 段落标题装饰条 */
  .section-title{display:flex;align-items:center;gap:.75rem;}
  .section-title::before{
    content:'';width:5px;height:24px;
    background:linear-gradient(180deg,#22C55E,#10B981);
    border-radius:6px;
  }
  /* 分页按钮 */
  .page-btn{
    background:#fff;border:1px solid var(--c-line);
    transition:all .2s ease;
  }
  .page-btn:hover{
    background:linear-gradient(180deg,#22C55E,#16A34A);
    color:#fff;border-color:transparent;
    transform:translateY(-1px);
    box-shadow:0 8px 20px -8px rgba(22,163,74,.5);
  }
  .page-btn.current{
    background:linear-gradient(180deg,#22C55E,#16A34A);
    color:#fff;border-color:transparent;cursor:default;
    box-shadow:0 8px 20px -8px rgba(22,163,74,.5);
  }
  .search-input:focus{outline:none;box-shadow:0 0 0 3px rgba(34,197,94,.2);}

  /* 滚动条：全局隐藏 */
  *{scrollbar-width:none;-ms-overflow-style:none;}
  *::-webkit-scrollbar{width:0;height:0;display:none;}
  html,body{overflow-x:hidden;}
  .no-bar::-webkit-scrollbar{display:none;}
  .no-bar{scrollbar-width:none;}

  /* 淡入向上 */
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  .fade-up{animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both;}

  /* 海报 fallback 兜底背景 */
  .poster-fallback{
    background:
      linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,0)) ,
      linear-gradient(160deg,var(--bg1,#16A34A),var(--bg2,#0EA5E9));
  }
</style>

            <span class="font-num text-[11px] text-red-500">${it.time}</span>
          </div>
        </div>
      </div>
    </a>
  `).join('');
</script>
</body>
